# Настройки для запуска сервера через wrangler (необязательно: можно всё сделать в панели Cloudflare).
name = "voiny-epoh"
main = "worker.js"
compatibility_date = "2025-06-01"

[vars]
TEST = "0"   # "1" включает тестовые кнопки (+3 прокрутки, ускорение походов) ВСЕМ игрокам. В продакшене только "0".
DEV = "0"    # вход без Telegram для проверки (заголовок X-Dev-User). В продакшене только "0".
# ADMINS = ""  # id администраторов через запятую, лучше задавать как Secret, а не здесь

[[d1_databases]]
binding = "DB"
database_name = "voiny-epoh"
database_id = "ВСТАВЬ_ID_БАЗЫ"
