<svg xmlns="http://www.w3.org/2000/svg" width="360" height="504" viewBox="0 0 360 504" role="img" aria-labelledby="title desc">
  <title id="title">Концепт карты дня «Домовой»</title>
  <desc id="desc">Анимированная векторная карточка в стиле Воинов Эпох: добрый домовой-хранитель со светящимся угольком.</desc>
  <defs>
    <linearGradient id="shell" x2="0" y2="1">
      <stop stop-color="#f8d972"/>
      <stop offset=".48" stop-color="#d99a35"/>
      <stop offset="1" stop-color="#805022"/>
    </linearGradient>
    <linearGradient id="night" x2=".8" y2="1">
      <stop stop-color="#26225e"/>
      <stop offset=".58" stop-color="#111533"/>
      <stop offset="1" stop-color="#080d20"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#ffdb76" stop-opacity=".7"/>
      <stop offset=".38" stop-color="#ffa83d" stop-opacity=".25"/>
      <stop offset="1" stop-color="#ffa83d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tunic" x2=".9" y2="1">
      <stop stop-color="#a94d32"/>
      <stop offset="1" stop-color="#572b38"/>
    </linearGradient>
    <linearGradient id="skin" x2=".8" y2="1">
      <stop stop-color="#f7cc9a"/>
      <stop offset="1" stop-color="#c97b56"/>
    </linearGradient>
    <linearGradient id="hair" x2=".8" y2="1">
      <stop stop-color="#bca27a"/>
      <stop offset=".48" stop-color="#75604f"/>
      <stop offset="1" stop-color="#403749"/>
    </linearGradient>
    <radialGradient id="coal">
      <stop stop-color="#fffbd0"/>
      <stop offset=".25" stop-color="#ffe978"/>
      <stop offset=".58" stop-color="#ff9e36"/>
      <stop offset="1" stop-color="#ef512d" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="smallGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="orbit" d="M226 235 C253 205 287 214 287 244 C287 273 251 287 226 265"/>
  </defs>

  <!-- Game-like collectible card frame -->
  <rect x="5" y="5" width="350" height="494" rx="22" fill="#0d1030" stroke="#07091d" stroke-width="5"/>
  <rect x="11" y="11" width="338" height="482" rx="18" fill="url(#shell)" stroke="#ffe9a2" stroke-width="2"/>
  <rect x="18" y="18" width="324" height="468" rx="14" fill="#10112c" stroke="#111533" stroke-width="4"/>
  <path d="M29 91V42Q29 29 42 29H318Q331 29 331 42V91" fill="#151632" stroke="#0d1030" stroke-width="4"/>
  <path d="M32 86V43Q32 32 44 32H316Q328 32 328 43V86" fill="none" stroke="#f4d173" stroke-width="2"/>
  <text x="180" y="61" text-anchor="middle" fill="#fff1bd" stroke="#0d1030" stroke-width="4" paint-order="stroke" font-family="Arial,sans-serif" font-size="25" font-weight="900" letter-spacing="1">ДОМОВОЙ</text>
  <rect x="116" y="72" width="128" height="23" rx="11.5" fill="#243765" stroke="#77dcff" stroke-width="1.6"/>
  <text x="180" y="88" text-anchor="middle" fill="#c9f4ff" font-family="Arial,sans-serif" font-size="11" font-weight="900" letter-spacing="1.5">КАРТА ДНЯ</text>

  <!-- Art window -->
  <rect x="27" y="101" width="306" height="281" rx="9" fill="url(#night)" stroke="#0d1030" stroke-width="4"/>
  <ellipse cx="180" cy="226" rx="133" ry="128" fill="url(#halo)"/>
  <path d="M28 314L71 270L110 300L153 245L197 299L242 256L332 326V381H28Z" fill="#181a3e" opacity=".78"/>
  <path d="M39 171L83 137L125 171V228H39Z" fill="#171a39" stroke="#0d1030" stroke-width="4" stroke-linejoin="round"/>
  <path d="M29 174L83 130L137 174" fill="none" stroke="#6d5481" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M57 189H107V226H57Z" fill="#ffbf62" opacity=".7"/>
  <path d="M82 189V226M57 207H107" stroke="#674b66" stroke-width="4"/>
  <path d="M262 185L293 159L322 185V225H262Z" fill="#171a39" stroke="#0d1030" stroke-width="4" stroke-linejoin="round"/>
  <path d="M252 186L293 151L333 186" fill="none" stroke="#6d5481" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M274 196H311V225H274Z" fill="#ffbf62" opacity=".42"/>
  <path d="M292 196V225M274 210H311" stroke="#674b66" stroke-width="3"/>

  <!-- Old, friendly Domovoy: broad silhouette and bold game-style ink -->
  <ellipse cx="180" cy="354" rx="89" ry="16" fill="#05091d" opacity=".52"/>
  <!-- shoulders and tunic -->
  <path d="M91 363Q94 307 126 288Q148 276 180 277Q212 276 234 288Q266 307 269 363V378H91Z" fill="url(#tunic)" stroke="#0d1030" stroke-width="7" stroke-linejoin="round"/>
  <path d="M121 300Q143 286 160 288L180 311L200 288Q220 286 239 300L222 332L207 378H153L138 332Z" fill="#d49a58" stroke="#0d1030" stroke-width="5" stroke-linejoin="round"/>
  <path d="M145 299L180 326L215 299L206 378H154Z" fill="#742f35" stroke="#0d1030" stroke-width="4" stroke-linejoin="round"/>
  <path d="M154 313L180 335L206 313M154 346L180 365L206 346" fill="none" stroke="#ffd875" stroke-width="3"/>
  <path d="M158 325L180 344L202 325" fill="none" stroke="#ffda79" stroke-width="4" stroke-linecap="round"/>
  <circle cx="180" cy="345" r="6" fill="#4edfff" stroke="#0d1030" stroke-width="3"/>

  <!-- arms -->
  <path d="M112 316Q91 326 88 348Q87 362 104 364Q119 363 126 342L137 326Z" fill="url(#skin)" stroke="#0d1030" stroke-width="6" stroke-linejoin="round"/>
  <path d="M247 312Q263 319 267 335L255 347Q246 338 233 331Z" fill="url(#skin)" stroke="#0d1030" stroke-width="6" stroke-linejoin="round"/>
  <path d="M91 348Q100 352 107 349" fill="none" stroke="#9c5546" stroke-width="3" stroke-linecap="round"/>

  <!-- head, ears and kindly face -->
  <path d="M133 193Q122 179 112 185Q105 193 115 207L133 216M227 193Q238 179 248 185Q255 193 245 207L227 216" fill="url(#skin)" stroke="#0d1030" stroke-width="5" stroke-linejoin="round"/>
  <path d="M130 163Q136 124 180 123Q224 124 230 163L224 220Q217 254 180 260Q143 254 136 220Z" fill="url(#skin)" stroke="#0d1030" stroke-width="6" stroke-linejoin="round"/>
  <!-- tousled gray-brown hair -->
  <path d="M130 181Q113 166 124 146L116 137L136 141Q136 119 151 116L151 132Q165 112 179 118L178 133Q195 112 209 124L205 139Q226 132 236 148L226 158Q238 172 226 187L215 178L208 158Q191 166 178 153Q160 166 144 157L139 179Z" fill="url(#hair)" stroke="#0d1030" stroke-width="6" stroke-linejoin="round"/>
  <path d="M129 146L139 157M152 126L157 145M183 126L184 145M211 139L204 155M124 163L140 170" fill="none" stroke="#e0c79c" stroke-width="3" stroke-linecap="round"/>
  <!-- brows, bright eyes, nose -->
  <path d="M147 184Q158 177 168 184M192 184Q203 177 213 184" fill="none" stroke="#554039" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="158" cy="195" rx="5" ry="7" fill="#0d1030"/>
  <ellipse cx="202" cy="195" rx="5" ry="7" fill="#0d1030"/>
  <circle cx="159.5" cy="193" r="1.7" fill="#fff"/>
  <circle cx="203.5" cy="193" r="1.7" fill="#fff"/>
  <path d="M179 193Q170 208 181 211" fill="none" stroke="#a75f4b" stroke-width="3" stroke-linecap="round"/>
  <!-- generous fluffy moustache and beard -->
  <path d="M142 214Q128 204 126 224Q126 239 142 241Q146 258 161 260Q169 273 181 267Q196 272 201 258Q220 254 220 237Q236 228 226 213Q217 205 207 214Q194 206 181 215Q166 204 154 214Z" fill="url(#hair)" stroke="#0d1030" stroke-width="6" stroke-linejoin="round"/>
  <path d="M145 224Q157 219 169 226M191 226Q203 219 215 224M159 240Q180 249 202 240M169 255Q180 260 191 255" fill="none" stroke="#d8c09a" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M163 222Q171 218 179 224Q187 218 197 222Q190 235 180 232Q169 235 163 222Z" fill="#c5a77d" stroke="#0d1030" stroke-width="3"/>
  <path d="M166 240Q180 246 194 240" fill="none" stroke="#342b35" stroke-width="3.5" stroke-linecap="round"/>
  <!-- keys at his belt -->
  <path d="M116 351Q127 358 140 351" fill="none" stroke="#f6ca66" stroke-width="5" stroke-linecap="round"/>
  <circle cx="128" cy="354" r="8" fill="none" stroke="#ffd76b" stroke-width="4"/>
  <path d="M132 361L139 369M139 369L145 365M139 369L139 375" fill="none" stroke="#ffd76b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="143" cy="357" r="6" fill="none" stroke="#75e4ff" stroke-width="3"/>
  <path d="M147 362L153 368M153 368L158 365" fill="none" stroke="#75e4ff" stroke-width="3" stroke-linecap="round"/>

  <!-- Orbiting ember and animated fireflies -->
  <path d="M229 242C255 209 286 219 285 245C284 270 256 282 233 263" fill="none" stroke="#ffcd65" stroke-opacity=".55" stroke-width="2.5" stroke-dasharray="3 8"/>
  <circle r="21" fill="url(#coal)" filter="url(#softGlow)">
    <animateMotion dur="4.2s" repeatCount="indefinite" rotate="auto"><mpath href="#orbit"/></animateMotion>
    <animate attributeName="r" values="18;24;18" dur="1.7s" repeatCount="indefinite"/>
  </circle>
  <path d="M0-9L3-3L9 0L3 3L0 9L-3 3L-9 0L-3-3Z" fill="#fff2ad" filter="url(#smallGlow)">
    <animateMotion dur="4.2s" repeatCount="indefinite" rotate="auto"><mpath href="#orbit"/></animateMotion>
    <animateTransform attributeName="transform" type="rotate" values="0;90;180;270;360" dur="4.2s" repeatCount="indefinite"/>
  </path>
  <g fill="#ffe88a" filter="url(#smallGlow)">
    <circle cx="65" cy="229" r="3"><animate attributeName="opacity" values=".2;1;.3" dur="2.1s" repeatCount="indefinite"/><animate attributeName="cy" values="229;218;229" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="292" cy="302" r="2.5"><animate attributeName="opacity" values=".15;1;.2" dur="1.7s" begin=".4s" repeatCount="indefinite"/><animate attributeName="cy" values="302;289;302" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="89" cy="274" r="2"><animate attributeName="opacity" values=".2;.9;.2" dur="2.4s" begin=".8s" repeatCount="indefinite"/></circle>
    <circle cx="275" cy="175" r="2.4"><animate attributeName="opacity" values=".1;1;.2" dur="2s" begin=".2s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#fff1bd" opacity=".8">
    <path d="M58 248L61 255L68 258L61 261L58 268L55 261L48 258L55 255Z"><animate attributeName="opacity" values=".25;1;.25" dur="2.2s" repeatCount="indefinite"/></path>
    <path d="M298 219L300 224L305 226L300 228L298 233L296 228L291 226L296 224Z"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></path>
  </g>

  <!-- clean, game-style information strip; values intentionally left unspecified -->
  <rect x="27" y="391" width="306" height="82" rx="9" fill="#171832" stroke="#0d1030" stroke-width="4"/>
  <path d="M39 403H321" stroke="#d6a34d" stroke-width="1.5" opacity=".8"/>
  <text x="180" y="421" text-anchor="middle" fill="#dce7ff" font-family="Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="1.2">ХРАНИТЕЛЬ ДОМА</text>
  <g font-family="Arial,sans-serif" text-anchor="middle" font-weight="800">
    <g transform="translate(65 443)"><circle r="10" fill="#9b3342" stroke="#f7cc78" stroke-width="1.5"/><path d="M-4 4L0-5L4 4M-2 1H2" fill="none" stroke="#fff0c1" stroke-width="1.7"/><text y="23" fill="#9eb5da" font-size="7.3">АТК</text></g>
    <g transform="translate(122 443)"><circle r="10" fill="#315f91" stroke="#8ee4ff" stroke-width="1.5"/><path d="M0-6L5-3V1Q4 5 0 7Q-4 5-5 1V-3Z" fill="none" stroke="#e9faff" stroke-width="1.6"/><text y="23" fill="#9eb5da" font-size="7.3">БРОНЯ</text></g>
    <g transform="translate(180 443)"><circle r="10" fill="#326d70" stroke="#8ee4ff" stroke-width="1.5"/><path d="M-5 2Q-1-5 5-3L2 1L5 4Q0 6-5 2Z" fill="#e9faff"/><text y="23" fill="#9eb5da" font-size="7.3">СКОРОСТЬ</text></g>
    <g transform="translate(238 443)"><circle r="10" fill="#6a4b31" stroke="#f7cc78" stroke-width="1.5"/><path d="M-4-4H4V4H-4ZM-2-1H2M-2 2H2" fill="none" stroke="#fff0c1" stroke-width="1.4"/><text y="23" fill="#9eb5da" font-size="6.4">ВЫНОСЛ.</text></g>
    <g transform="translate(295 443)"><circle r="10" fill="#514280" stroke="#c6a8ff" stroke-width="1.5"/><path d="M0-6L2-2L6 0L2 2L0 6L-2 2L-6 0L-2-2Z" fill="#f0e7ff"/><text y="23" fill="#9eb5da" font-size="7.3">ДУХ</text></g>
  </g>
  <path d="M42 477H318" stroke="#f2d381" stroke-width="1" opacity=".5"/>
</svg>
